[project]
name = "protonpass-1pass"
version = "0.1.0"
description = "A cli tool to format proton password exported csvs into 1password supported format"
readme = "README.md"
authors = [
    { name = "shawonashraf", email = "" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
protonpass-1pass = "protonpass_1pass.main:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
